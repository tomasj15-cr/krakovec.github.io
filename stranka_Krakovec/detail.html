<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prohlížeč modelu</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            overflow: hidden; 
            font-family: sans-serif;
        }

        #fullscreen-model {
            width: 100vw;
            height: 100vh;
            --poster-color: transparent; 
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            z-index: 100;
            border: 1px solid #e0a800;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: #e0a800;
            color: black;
        }

        .loading-overlay {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #e0a800;
            font-weight: bold;
            z-index: 10;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #e0a800;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar-container {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar-fill {
            display: block;
            height: 100%;
            background-color: #e0a800;
            width: 0%;
            transition: width 0.1s;
        }

        model-viewer[loaded] > .loading-overlay {
            display: none !important;
        }
    </style>
</head>
<body>

    <a href="modely.html" class="back-btn">← Zpět</a>

    <model-viewer 
        id="fullscreen-model" 
        src="" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1" 
        alt="Detail modelu">

        <div class="loading-overlay" slot="progress-bar">
            <div class="spinner"></div>
            <div>NAČÍTÁM MODEL...</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
        </div>

    </model-viewer>

    <script src="js/script.js"></script>

</body>
</html>
