<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrad Krakovec - Virtuální prohlídka</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        #panorama {
            width: 100%;
            height: calc(100vh - 75px); 
            position: relative;
        }
        .scene-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%); 
            z-index: 10;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #444;
        }

        .scene-btn {
            background-color: transparent;
            color: white;
            border: 2px solid #e0a800;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-family: 'Segoe UI', sans-serif;
        }

        .scene-btn:hover, .scene-btn.active {
            background-color: #e0a800;
            color: black;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">HRAD KRAKOVEC</a>
        <nav>
            <a href="index.html">Historie</a>
            <a href="mapa.html">Mapa</a>
            <a href="modely.html">3D Modely</a>
            <a href="pano.html" class="active">Panorama</a>
            <a href="potree.html">PointCloud</a>
        </nav>
    </header>

    <div id="panorama">
        <div class="scene-controls">
            <button class="scene-btn active" onclick="zmenScenu('most', this)">Most</button>
            <button class="scene-btn" onclick="zmenScenu('predhradi', this)">Předhradí</button>
            <button class="scene-btn" onclick="zmenScenu('nadvori', this)">Nádvoří</button>
            <button class="scene-btn" onclick="zmenScenu('parkan', this)">Parkán</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <script>
        var viewer = pannellum.viewer('panorama', {   
            "default": {
                "firstScene": "most", 
                "sceneFadeDuration": 1000,
                "autoLoad": true
            },

            "scenes": {
                "most": {
                    "title": "Most",
                    "hfov": 110,
                    "pitch": -3,
                    "yaw": 1,
                    "panorama": "data/pano/most.png" 
                },
                "predhradi": {
                    "title": "Předhradí",
                    "hfov": 110,
                    "panorama": "data/pano/predhradi.png" 
                },
                "nadvori": {
                    "title": "Nádvoří",
                    "hfov": 110,
                    "yaw": 117,
                    "panorama": "data/pano/nadvori.png" 
                },
                "parkan": {
                    "title": "Parkán",
                    "hfov": 120,
                    "panorama": "data/pano/parkan.png" 
                },
            }
        });

        function zmenScenu(sceneId, btnElement) {
            viewer.loadScene(sceneId);
            document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>

</body>
</html>
