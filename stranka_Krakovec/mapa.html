<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrad Krakovec - Mapa</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        .map-wrapper {
            height: calc(100vh - 70px); 
            width: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">HRAD KRAKOVEC</a>
        <nav>
            <a href="index.html">Historie</a>
            <a href="mapa.html" class="active">Mapa</a>
            <a href="modely.html">3D Modely</a>
            <a href="pano.html">Panorama</a>
            <a href="potree.html">PointCloud</a>
        </nav>
    </header>

    <div class="map-wrapper">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        var map = L.map('map').setView([50.0169, 13.6391], 17);

        var ortoLayer = L.tileLayer.wms("https://geoportal.cuzk.cz/WMS_ORTOFOTO_PUB/WMService.aspx", {
            layers: 'GR_ORTFOTORGB',
            format: 'image/png',
            transparent: true,
            attribution: 'ČÚZK Ortofoto'
        }).addTo(map);

        var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        var imgUrl = "data/indikacni_geo.png"; 

        var imgBounds = [[50.0222625,13.6374279 ], [50.0156048,13.6503093]]; 

        var staraMapaLayer = L.imageOverlay(imgUrl, imgBounds, {
            opacity: 0.7, 
            alt: "Indikační skica"
        });

        var baseMaps = {
            "Ortofoto": ortoLayer,
            "OSM": osmLayer
            
        };

        var overlayMaps = {
            "Historická mapa (Indikační skica)": staraMapaLayer
        };

        L.control.layers(baseMaps, overlayMaps).addTo(map);

    </script>
</body>
</html>
