<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrad Krakovec - 3D Modely</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    <style>
        .models-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 40px 20px;
        }

        .model-card {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
            background: #2c2c2c;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }

        .model-card h2 {
            margin-top: 0;
            color: #e0a800; 
        }

        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #1a1a1a;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .btn-fullscreen {
            display: inline-block;
            padding: 12px 24px;
            background-color: #e0a800;
            color: #1a1a1a;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-fullscreen:hover {
            background-color: #fff;
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

    <header class="site-header">
        <a href="index.html" class="logo">HRAD KRAKOVEC</a>
        <nav>
            <a href="index.html">Historie</a>
            <a href="mapa.html">Mapa</a>
            <a href="modely.html" class="active">3D Modely</a>
            <a href="pano.html">Panorama</a>
            <a href="potree.html">PointCloud</a>
        </nav>
    </header>

    <div class="content">
        <h1>Modely hradu</h1>
    </div>

    <div class="models-container">
        
        <div class="model-card">
            <h2>Původní podoba</h2>
            
            <model-viewer 
                src="data/Krakovec_muj.glb" 
                alt="Model původního hradu"
                auto-rotate
                rotation-per-second="30deg"
                interaction-prompt="none"
                shadow-intensity="1"
                field-of-view = "5deg"
                camera-orbit="95deg 75deg 0000m"
                camera-target="10m 100m auto">
            </model-viewer>
            
            <a href="detail.html?model=data/Krakovec_muj.glb" class="btn-fullscreen">Prohlédnout...</a>
        </div>

        <div class="model-card">
            <h2>Současný stav</h2>
            
            <model-viewer 
                src="data/Krakovec_stary.glb" 
                alt="3D model zříceniny"
                auto-rotate
                rotation-per-second="30deg"
                interaction-prompt="none"
                camera-orbit="0deg 75deg 60%" 
                shadow-intensity="1">
            </model-viewer>
            
            <a href="detail.html?model=data/Krakovec_stary.glb" class="btn-fullscreen">Prohlédnout...</a>
        </div>

    </div>

</body>
</html>
